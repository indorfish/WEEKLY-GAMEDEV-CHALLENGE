<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic-Tac-Toe</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #222;
    }
    #app {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #status {
      font-size: 1.4rem;
      min-height: 1.8rem;
      text-align: center;
    }
    #board {
      display: block;
      touch-action: manipulation;
    }
    #restart {
      font: inherit;
      padding: 8px 20px;
      border: 1px solid #222;
      border-radius: 6px;
      background: #fff;
      color: #222;
      cursor: pointer;
    }
    #restart:hover { background: #f0f0f0; }
    #restart:focus-visible { outline: 3px solid #4a90d9; outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="status">Loading…</div>
    <canvas id="board"></canvas>
    <button id="restart" type="button">New game</button>
  </div>
  <script src="game.js"></script>
</body>
</html>
